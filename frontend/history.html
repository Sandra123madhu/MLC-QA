<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analysis History — MLC QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <!-- BACKEND_URL, token, authHeaders(), logout() all come from here -->
  <script src="script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:    #0f1117;
      --ink2:   #4a5068;
      --ink3:   #9098b0;
      --border: #e8eaf0;
      --bg:     #ffffff;
      --bg2:    #f6f7fb;
      --bg3:    #eef0f7;
      --blue:   #2563eb;
      --blue2:  #1d4ed8;
      --pass:   #16a34a;
      --pass-dim: rgba(22,163,74,0.08);
      --fail:   #dc2626;
      --fail-dim: rgba(220,38,38,0.08);
      --sidebar-w: 220px;
      --r: 6px; --r-lg: 10px; --r-xl: 12px;
      --t: 0.13s ease;
    }
    body {
      background: var(--bg2); color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
    }
    h1,h2,h3,h4 { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; line-height: 1.25; color: var(--ink); letter-spacing: -0.02em; }
    a { color: var(--blue); text-decoration: none; transition: opacity var(--t); }
    a:hover { opacity: 0.8; }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
      background: var(--bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 100;
    }
    .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
    .logo-mark {
      width: 28px; height: 28px; background: var(--blue); border-radius: 7px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-mark svg { width: 15px; height: 15px; fill: #fff; }
    .logo-text { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 0.95rem; letter-spacing: 0.05em; color: var(--ink); }
    .logo-text span { color: var(--blue); }

    .sidebar-nav { padding: 14px 0 8px; flex: 1; overflow-y: auto; }
    .nav-label { font-size: 0.62rem; font-weight: 600; color: var(--ink3); letter-spacing: 0.12em; text-transform: uppercase; padding: 0 18px; margin-bottom: 4px; font-family: 'IBM Plex Mono', monospace; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px; color: var(--ink2);
      font-size: 0.83rem; font-weight: 400;
      text-decoration: none; transition: all var(--t);
      border: none; background: none; width: 100%; text-align: left; cursor: pointer;
      position: relative;
    }
    .nav-item:hover { color: var(--ink); background: var(--bg2); opacity: 1; }
    .nav-item.active { color: var(--blue); background: rgba(37,99,235,0.07); font-weight: 500; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--blue); border-radius: 0 2px 2px 0; }
    .nav-icon { width: 17px; text-align: center; font-size: 0.85rem; opacity: 0.6; }
    .nav-item.active .nav-icon { opacity: 1; }

    .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); }
    .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px 0; margin-bottom: 9px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(37,99,235,0.1);
      border: 1px solid rgba(37,99,235,0.2); display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--blue);
      flex-shrink: 0; font-weight: 500;
    }
    .user-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    .user-role { font-size: 0.68rem; color: var(--ink3); margin-top: 1px; }
    .logout-btn {
      width: 100%; background: transparent; border: 1px solid var(--border);
      color: var(--ink2); padding: 7px; border-radius: var(--r);
      font-family: 'IBM Plex Sans', sans-serif; font-size: 0.78rem; cursor: pointer;
      transition: all var(--t);
    }
    .logout-btn:hover { border-color: rgba(220,38,38,0.4); color: var(--fail); background: var(--fail-dim); }

    /* ── Main ── */
    .main { margin-left: var(--sidebar-w); padding: 40px 48px; }

    .page-header { margin-bottom: 28px; }
    .breadcrumb { font-size: 0.75rem; color: var(--ink3); margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; }
    .breadcrumb a { color: var(--ink3); text-decoration: none; transition: color var(--t); }
    .breadcrumb a:hover { color: var(--blue); opacity: 1; }
    .breadcrumb span { margin: 0 5px; }
    .page-header h1 { font-size: 1.55rem; font-weight: 600; margin-bottom: 4px; }
    .page-header p { color: var(--ink2); font-size: 0.85rem; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
    }
    .filter-left { display: flex; gap: 6px; }
    .filter-btn {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--ink2); padding: 7px 16px; border-radius: var(--r);
      font-family: 'IBM Plex Sans', sans-serif; font-size: 0.8rem;
      cursor: pointer; transition: all var(--t);
    }
    .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(37,99,235,0.07); font-weight: 500; }
    .record-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.73rem; color: var(--ink3); }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-xl); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border); background: var(--bg2); }
    thead th {
      padding: 11px 18px; text-align: left;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3);
      font-weight: 500;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background var(--t); cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg2); }
    tbody td { padding: 14px 18px; font-size: 0.85rem; vertical-align: middle; color: var(--ink); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 500; font-family: 'IBM Plex Mono', monospace;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-pass { background: var(--pass-dim); color: var(--pass); border: 1px solid rgba(22,163,74,0.2); }
    .badge-fail { background: var(--fail-dim); color: var(--fail); border: 1px solid rgba(220,38,38,0.2); }

    .test-chip {
      background: rgba(37,99,235,0.07); border: 1px solid rgba(37,99,235,0.15);
      color: var(--blue); padding: 3px 9px; border-radius: var(--r);
      font-size: 0.72rem; font-family: 'IBM Plex Mono', monospace;
    }
    .filename { color: var(--ink2); font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; }
    .date-cell { color: var(--ink3); font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; }

    /* ── Expanded summary row ── */
    .summary-row { display: none; }
    .summary-row.open { display: table-row; }
    .summary-row td {
      padding: 0 18px 18px;
      background: var(--bg2);
    }
    .summary-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 20px;
    }
    .summary-box pre {
      white-space: pre-wrap; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem; color: var(--ink2); line-height: 1.7;
    }
    .plot-thumb {
      width: 100%; border-radius: var(--r-lg); margin-bottom: 16px;
      border: 1px solid var(--border); display: block;
    }
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--blue);
      color: var(--blue); padding: 7px 16px; border-radius: var(--r);
      font-family: 'IBM Plex Sans', sans-serif; font-size: 0.8rem;
      cursor: pointer; margin-top: 14px; transition: all var(--t);
    }
    .btn-dl:hover { background: rgba(37,99,235,0.07); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 72px 24px;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.35; }
    .empty-state h3 { font-size: 1rem; margin-bottom: 6px; color: var(--ink2); }
    .empty-state p { font-size: 0.84rem; color: var(--ink3); margin-bottom: 22px; }
    .btn-primary {
      background: var(--blue); color: #fff; border: none;
      padding: 10px 24px; border-radius: var(--r);
      font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 0.85rem;
      cursor: pointer; text-decoration: none; display: inline-block;
      transition: background var(--t), box-shadow var(--t);
    }
    .btn-primary:hover { background: var(--blue2); box-shadow: 0 4px 14px rgba(37,99,235,0.3); opacity: 1; }

    /* ── Loading skeleton ── */
    .skeleton-row td { padding: 16px 18px; }
    .skel {
      height: 11px; border-radius: 4px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg3) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media(max-width:768px) { .sidebar{display:none;} .main{margin-left:0;padding:24px 20px;} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <a href="dashboard.html" class="sidebar-logo">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
      <div class="logo-text">MLC<span>QA</span></div>
    </a>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Menu</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">▦</span> Dashboard</a>
    <a class="nav-item" href="mlc-qa.html"><span class="nav-icon">⚡</span> Picket Fence</a>
    <a class="nav-item" href="winston-lutz.html"><span class="nav-icon">◎</span> Winston-Lutz</a>
    <a class="nav-item" href="starshot.html"><span class="nav-icon">✦</span> Starshot</a>
    <a class="nav-item" href="congruence.html"><span class="nav-icon">⊞</span> Congruence</a>
    <a class="nav-item active" href="history.html"><span class="nav-icon">≡</span> History</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="user-role">Medical Physicist</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a><span>/</span> Analysis History</div>
    <h1>Analysis History</h1>
    <p>Your last 30 days of QA analyses — auto-cleared after 30 days</p>
  </div>

  <div class="filter-bar">
    <div class="filter-left">
      <button class="filter-btn active" onclick="filterResults('all', this)">All</button>
      <button class="filter-btn" onclick="filterResults('pass', this)">Pass</button>
      <button class="filter-btn" onclick="filterResults('fail', this)">Fail</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="record-count" id="recordCount"></span>
      <span id="dataSourceBadge" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 8px;border-radius:4px;"></span>
      <button id="clearHistoryBtn" onclick="clearLocalHistory()" style="display:none;background:transparent;border:1px solid rgba(220,38,38,0.35);color:rgba(220,38,38,0.7);padding:5px 12px;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:0.76rem;cursor:pointer;transition:all var(--t);" onmouseover="this.style.borderColor='var(--fail)';this.style.color='var(--fail)'" onmouseout="this.style.borderColor='rgba(220,38,38,0.35)';this.style.color='rgba(220,38,38,0.7)'">Clear local history</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="historyTable">
      <thead>
        <tr>
          <th>Result</th>
          <th>Test Type</th>
          <th>File</th>
          <th>Date &amp; Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:150px"></div></td>
          <td><div class="skel" style="width:110px"></div></td>
          <td><div class="skel" style="width:36px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:130px"></div></td>
          <td><div class="skel" style="width:110px"></div></td>
          <td><div class="skel" style="width:36px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:170px"></div></td>

</main>

<script>
// ── User name display ─────────────────────────────────────────────────────────
function applyName(name) {
  if (name && name !== "undefined" && name !== "null" && name.trim() !== "") {
    document.getElementById("sidebarName").textContent = name;
    document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
  }
}

// 1. Try localStorage immediately (fast path — works after first login)
const storedName = localStorage.getItem("mlcqa_name");
applyName(storedName);

// 2. If not in localStorage yet, listen for script.js to fetch it from /me
if (!storedName || storedName === "undefined" || storedName === "null" || storedName.trim() === "") {
  document.addEventListener("mlcqa:name-resolved", (e) => applyName(e.detail.name));

  // 3. Fallback: fetch /me directly in case script.js already ran before this listener was added
  fetch(`${BACKEND_URL}/me`, {
    headers: { "Authorization": `Bearer ${localStorage.getItem("mlcqa_token")}` }
  })
  .then(r => r.ok ? r.json() : null)
  .then(data => { if (data && data.name) { localStorage.setItem("mlcqa_name", data.name); applyName(data.name); } })
  .catch(() => {});
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
    + " · " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

let allAnalyses = [];
let openRow = null;

function normalizeServer(a) {
  return {
    passed:    a.passed,
    testType:  a.test_type  || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || a.analysis_summary || "",
    imageUrl:  a.image_url  || null,
    timestamp: a.created_at || new Date().toISOString(),
    source:    "server"
  };
}
function normalizeLocal(a) {
  return {
    passed:    a.passed,
    testType:  a.testType   || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || "",
    imageUrl:  a.imageUrl   || null,
    timestamp: a.timestamp  || new Date().toISOString(),
    source:    "local"
  };
}

function setSourceBadge(source) {
  const badge = document.getElementById("dataSourceBadge");
  const clearBtn = document.getElementById("clearHistoryBtn");
  if (source === "server") {
    badge.textContent = "● server";
    badge.style.cssText = "display:inline-block;background:var(--pass-dim);color:var(--pass);border:1px solid rgba(22,163,74,0.2);font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "none";
  } else if (source === "local") {
    badge.textContent = "● local";
    badge.style.cssText = "display:inline-block;background:rgba(37,99,235,0.07);color:var(--blue);border:1px solid rgba(37,99,235,0.18);font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  } else if (source === "merged") {
    badge.textContent = "● server + local";
    badge.style.cssText = "display:inline-block;background:rgba(37,99,235,0.07);color:var(--blue);border:1px solid rgba(37,99,235,0.18);font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  }
}

function renderRows(data) {
  const tbody = document.getElementById("historyBody");

  if (data.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <h3>No analyses found</h3>
          <p>Complete a QA analysis to see it logged here automatically</p>
          <a class="btn-primary" href="mlc-qa.html">Run Picket Fence</a>
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach((a, i) => {
    const mainRow = document.createElement("tr");
    mainRow.id = `row-${i}`;
    const sourceDot = a.source === "local"
      ? `<span title="Saved locally" style="color:var(--blue);font-size:0.6rem;margin-left:4px;opacity:0.5;">●</span>`
      : "";
    mainRow.innerHTML = `
      <td><span class="badge ${a.passed ? 'badge-pass' : 'badge-fail'}">${a.passed ? 'Pass' : 'Fail'}</span></td>
      <td><span class="test-chip">${a.testType}</span></td>
      <td class="filename">${a.filename}${sourceDot}</td>
      <td class="date-cell">${formatDate(a.timestamp)}</td>
      <td style="color:var(--ink3);font-size:0.9rem;" id="arrow-${i}">▸</td>`;
    mainRow.addEventListener("click", () => toggleSummary(i));
    tbody.appendChild(mainRow);

    const summaryRow = document.createElement("tr");
    summaryRow.className = "summary-row";
    summaryRow.id = `summary-${i}`;
    summaryRow.innerHTML = `
      <td colspan="5">
        <div class="summary-box">
          ${a.imageUrl ? `<img class="plot-thumb" src="${a.imageUrl}" alt="Analysis plot" loading="lazy" onerror="this.style.display='none'"/>` : ""}
          <pre>${a.summary || "No summary available."}</pre>
          <button class="btn-dl" onclick="downloadHistoryPDF(${i})">⬇ Download PDF</button>
        </div>
      </td>`;
    tbody.appendChild(summaryRow);
  });
}

function toggleSummary(i) {
  const sRow  = document.getElementById(`summary-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  const isOpen = sRow.classList.contains("open");

  if (openRow !== null && openRow !== i) {
    document.getElementById(`summary-${openRow}`).classList.remove("open");
    const prevArrow = document.getElementById(`arrow-${openRow}`);
    if (prevArrow) prevArrow.textContent = "▸";
  }

  sRow.classList.toggle("open", !isOpen);
  arrow.textContent = isOpen ? "▸" : "▾";
  openRow = isOpen ? null : i;
}

function filterResults(type, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  openRow = null;

  let filtered = allAnalyses;
  if (type === "pass") filtered = allAnalyses.filter(a => a.passed === true);
  if (type === "fail") filtered = allAnalyses.filter(a => a.passed === false);

  document.getElementById("recordCount").textContent =
    `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;
  renderRows(filtered);
}

function clearLocalHistory() {
  if (!confirm("Clear all locally-stored analysis history? This cannot be undone.")) return;
  HistoryManager.clear();
  loadHistory();
}

function mergeAndSort(serverEntries, localEntries) {
  const all = [...serverEntries];
  localEntries.forEach(local => {
    const localTs = new Date(local.timestamp).getTime();
    const isDupe = serverEntries.some(s => {
      const sTs = new Date(s.timestamp).getTime();
      return Math.abs(localTs - sTs) < 5000 && s.testType === local.testType && s.filename === local.filename;
    });
    if (!isDupe) all.push(local);
  });
  return all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

async function loadHistory() {
  const localEntries = HistoryManager.getAll().map(normalizeLocal);

  try {
    const res = await fetch(`${BACKEND_URL}/history`, {
      headers: { "Authorization": `Bearer ${localStorage.getItem("mlcqa_token")}` },
      signal: AbortSignal.timeout(8000)
    });

    if (res.status === 401) { logout(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const serverEntries = (data.analyses || []).map(normalizeServer);

    if (serverEntries.length > 0 && localEntries.length === 0) {
      allAnalyses = serverEntries;
      setSourceBadge("server");
    } else if (serverEntries.length > 0 && localEntries.length > 0) {
      allAnalyses = mergeAndSort(serverEntries, localEntries);
      setSourceBadge("merged");
    } else if (localEntries.length > 0) {
      allAnalyses = localEntries;
      setSourceBadge("local");
    } else {
      allAnalyses = [];
    }

  } catch {
    allAnalyses = localEntries;
    if (localEntries.length > 0) setSourceBadge("local");
  }

  document.getElementById("recordCount").textContent =
    `${allAnalyses.length} record${allAnalyses.length !== 1 ? "s" : ""}`;
  renderRows(allAnalyses);
}

loadHistory();

// ── PDF Download ──────────────────────────────────────────────────────────────
async function downloadHistoryPDF(i) {
  const a = allAnalyses[i];
  if (!a) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const W = 210;
  const M = 14;

  doc.setFillColor(15, 30, 55);
  doc.rect(0, 0, W, 26, "F");
  doc.setFillColor(37, 99, 235);
  doc.rect(0, 0, 5, 26, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(255, 255, 255);
  doc.text("MLC QA — " + (a.testType || a.test_type || "Analysis") + " Report", M + 4, 12);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(180, 210, 230);
  const dt = new Date(a.timestamp || a.created_at).toLocaleString("en-GB", { dateStyle: "long", timeStyle: "short" });
  doc.text("Date: " + dt, M + 4, 19);
  doc.text("File: " + (a.filename || "—"), M + 4, 24);

  let y = 36;

  const badgeColor = a.passed ? [22, 163, 74] : [220, 38, 38];
  doc.setFillColor(...badgeColor);
  doc.roundedRect(M, y, W - M * 2, 13, 2, 2, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(255, 255, 255);
  doc.text(a.passed ? "✓  PASS" : "✗  FAIL", M + 5, y + 8);
  y += 18;

  const _imgUrl = a.imageUrl || a.image_url || null;
  if (_imgUrl) {
    try {
      const res  = await fetch(_imgUrl);
      const blob = await res.blob();
      const b64  = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
      const imgW = W - M * 2;
      const imgH = imgW * 0.5;
      doc.setDrawColor(180, 200, 220);
      doc.setLineWidth(0.3);
      doc.rect(M, y, imgW, imgH);
      doc.addImage(b64, "PNG", M, y, imgW, imgH);
      y += imgH + 5;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(7.5);
      doc.setTextColor(80, 105, 135);
      doc.text("Figure: Pylinac " + (a.testType || a.test_type || "") + " — Analyzed Image", M, y);
      y += 9;
    } catch { y += 4; }
  }

  const summaryLines = doc.splitTextToSize(a.summary || "", W - M * 2 - 10);
  const boxH = summaryLines.length * 5.4 + 16;
  doc.setFillColor(245, 248, 252);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "F");
  doc.setDrawColor(200, 215, 230);
  doc.setLineWidth(0.3);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "S");
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(15, 40, 80);
  doc.text("ANALYSIS SUMMARY", M + 5, y);
  y += 7;
  doc.setFont("courier", "normal");
  doc.setFontSize(8.2);
  doc.setTextColor(20, 45, 80);
  summaryLines.forEach(line => {
    if (y > 272) {
      doc.addPage();
      y = 18;
      doc.setFillColor(245, 248, 252);
      doc.roundedRect(M, y - 4, W - M * 2, 240, 2, 2, "F");
      doc.setFont("courier", "normal");
      doc.setFontSize(8.2);
      doc.setTextColor(20, 45, 80);
    }
    doc.text(line, M + 5, y);
    y += 5.4;
  });

  const pages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(235, 241, 248);
    doc.rect(0, 284, W, 13, "F");
    doc.setDrawColor(180, 200, 220);
    doc.setLineWidth(0.3);
    doc.line(0, 284, W, 284);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(60, 85, 120);
    doc.text("MLC QA Platform  ·  For clinical physics use only  ·  Not for diagnostic use", M, 291);
    doc.text("Page " + p + " of " + pages, W - 28, 291);
  }
  doc.save("MLCQA_" + (a.filename || "report") + ".pdf");
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analysis History — MLC QA</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- BACKEND_URL, token, authHeaders(), logout() all come from here -->
  <script src="script.js"></script>
  <style>
    /* ── History-page specific styles ── */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
    }
    .filter-left { display: flex; gap: 6px; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 500; }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border); background: var(--bg); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background var(--t); cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }
    tbody td { padding: 14px 18px; font-size: 0.85rem; vertical-align: middle; color: var(--text); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 100px;
      font-size: 0.72rem; font-weight: 500; font-family: var(--mono);
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-pass { background: var(--pass-dim); color: var(--pass); border: 1px solid rgba(26,158,106,0.2); }
    .badge-fail { background: var(--fail-dim); color: var(--coral-deep); border: 1px solid rgba(200,90,67,0.2); }

    .test-chip {
      background: var(--accent-dim); border: 1px solid var(--accent-border);
      color: var(--accent); padding: 3px 9px; border-radius: var(--r);
      font-size: 0.72rem; font-family: var(--mono);
    }
    .filename { color: var(--text); font-family: var(--mono); font-size: 0.76rem; }
    .date-cell { color: var(--text); font-size: 0.8rem; font-family: var(--mono); }

    .summary-row { display: none; }
    .summary-row.open { display: table-row; }
    .summary-row td { padding: 0 18px 18px; background: var(--bg); }
    .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; }
    .summary-box pre { white-space: pre-wrap; font-family: var(--mono); font-size: 0.8rem; color: var(--text); line-height: 1.7; }
    .plot-thumb { width: 100%; border-radius: var(--r-lg); margin-bottom: 16px; border: 1px solid var(--border); display: block; }
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); padding: 7px 16px; border-radius: var(--r);
      font-family: var(--font); font-size: 0.8rem;
      cursor: pointer; margin-top: 14px; transition: all var(--t);
    }
    .btn-dl:hover { background: var(--accent-dim); }

    .empty-state { text-align: center; padding: 72px 24px; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.35; }
    .empty-state h3 { font-size: 1rem; margin-bottom: 6px; color: var(--text); }
    .empty-state p { font-size: 0.84rem; color: var(--text); margin-bottom: 22px; }

    .skeleton-row td { padding: 16px 18px; }
    .skel {
      height: 11px; border-radius: 4px;
      background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <a href="dashboard.html" class="sidebar-logo">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
      <div class="logo-text">MLC<span>QA</span></div>
    </a>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Menu</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">▦</span> Dashboard</a>
    <a class="nav-item" href="mlc-qa.html"><span class="nav-icon">⚡</span> Picket Fence</a>
    <a class="nav-item" href="winston-lutz.html"><span class="nav-icon">◎</span> Winston-Lutz</a>
    <a class="nav-item" href="starshot.html"><span class="nav-icon">✦</span> Starshot</a>

  <div class="sidebar-footer">

      </div>

    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a><span>/</span> Analysis History</div>
    <h1>Analysis History</h1>
    <p>Your last 30 days of QA analyses — auto-cleared after 30 days</p>
  </div>

  <div class="filter-bar">
    <div class="filter-left">
      <button class="filter-btn active" onclick="filterResults('all', this)">All</button>
      <button class="filter-btn" onclick="filterResults('pass', this)">Pass</button>
      <button class="filter-btn" onclick="filterResults('fail', this)">Fail</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="record-count" id="recordCount"></span>
      <span id="dataSourceBadge" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:3px 8px;border-radius:4px;"></span>
      <button id="clearHistoryBtn" onclick="clearLocalHistory()" style="display:none;background:transparent;border:1px solid rgba(220,38,38,0.35);color:rgba(220,38,38,0.7);padding:5px 12px;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:0.76rem;cursor:pointer;transition:all var(--t);" onmouseover="this.style.borderColor='var(--fail)';this.style.color='var(--fail)'" onmouseout="this.style.borderColor='rgba(220,38,38,0.35)';this.style.color='rgba(220,38,38,0.7)'">Clear local history</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="historyTable">
      <thead>
        <tr>
          <th>Result</th>
          <th>Test Type</th>
          <th>File</th>
          <th>Date &amp; Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:150px"></div></td>
          <td><div class="skel" style="width:110px"></div></td>
          <td><div class="skel" style="width:36px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:130px"></div></td>
          <td><div class="skel" style="width:110px"></div></td>
          <td><div class="skel" style="width:36px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:56px"></div></td>
          <td><div class="skel" style="width:96px"></div></td>
          <td><div class="skel" style="width:170px"></div></td>
          <td><div class="skel" style="width:110px"></div></td>
          <td><div class="skel" style="width:36px"></div></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script>
// ── User name display ─────────────────────────────────────────────────────────
function applyName(name) {
  if (name && name !== "undefined" && name !== "null" && name.trim() !== "") {
    document.getElementById("sidebarName").textContent = name;
    document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
  }
}

// Decode email from JWT payload (base64) as last-resort fallback
function nameFromToken() {
  try {
    const token = localStorage.getItem("mlcqa_token");
    if (!token) return null;
    const payload = JSON.parse(atob(token.split(".")[1]));
    const email = payload.sub || payload.email || "";
    return email ? email.split("@")[0] : null;
  } catch (e) { return null; }
}

(function initUserName() {
  const cached = localStorage.getItem("mlcqa_name");
  if (cached && cached !== "undefined" && cached !== "null" && cached.trim() !== "") {
    applyName(cached);
  } else {
    // Fallback: derive a display name from the JWT token's email
    const fallback = nameFromToken();
    if (fallback) {
      localStorage.setItem("mlcqa_name", fallback);
      applyName(fallback);
    }
  }
  // Also listen in case script.js resolves the name asynchronously
  document.addEventListener("mlcqa:name-resolved", function(e) { applyName(e.detail.name); });
})();

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
    + " · " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

let allAnalyses = [];
let openRow = null;

function normalizeServer(a) {
  return {
    passed:    a.passed,
    testType:  a.test_type  || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || a.analysis_summary || "",
    imageUrl:  a.image_url  || null,
    timestamp: a.created_at || new Date().toISOString(),
    source:    "server"
  };
}
function normalizeLocal(a) {
  return {
    passed:    a.passed,
    testType:  a.testType   || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || "",
    imageUrl:  a.imageUrl   || null,
    timestamp: a.timestamp  || new Date().toISOString(),
    source:    "local"
  };
}

function setSourceBadge(source) {
  const badge = document.getElementById("dataSourceBadge");
  const clearBtn = document.getElementById("clearHistoryBtn");
  if (source === "server") {
    badge.textContent = "● server";
    badge.style.cssText = "display:inline-block;background:var(--pass-dim);color:var(--pass);border:1px solid rgba(26,158,106,0.2);font-family:var(--mono);font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "none";
  } else if (source === "local") {
    badge.textContent = "● local";
    badge.style.cssText = "display:inline-block;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);font-family:var(--mono);font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  } else if (source === "merged") {
    badge.textContent = "● server + local";
    badge.style.cssText = "display:inline-block;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);font-family:var(--mono);font-size:0.7rem;padding:3px 8px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  }
}

function renderRows(data) {
  const tbody = document.getElementById("historyBody");

  if (data.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <h3>No analyses found</h3>
          <p>Complete a QA analysis to see it logged here automatically</p>
          <a class="btn-primary" href="mlc-qa.html">Run Picket Fence</a>
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach((a, i) => {
    const mainRow = document.createElement("tr");
    mainRow.id = `row-${i}`;
    const sourceDot = a.source === "local"
      ? `<span title="Saved locally" style="color:var(--blue);font-size:0.6rem;margin-left:4px;opacity:0.5;">●</span>`
      : "";
    mainRow.innerHTML = `
      <td><span class="badge ${a.passed ? 'badge-pass' : 'badge-fail'}">${a.passed ? 'Pass' : 'Fail'}</span></td>
      <td><span class="test-chip">${a.testType}</span></td>
      <td class="filename">${a.filename}${sourceDot}</td>
      <td class="date-cell">${formatDate(a.timestamp)}</td>
      <td style="color:var(--text);font-size:0.9rem;" id="arrow-${i}">▸</td>`;
    mainRow.addEventListener("click", () => toggleSummary(i));
    tbody.appendChild(mainRow);

    const summaryRow = document.createElement("tr");
    summaryRow.className = "summary-row";
    summaryRow.id = `summary-${i}`;
    summaryRow.innerHTML = `
      <td colspan="5">
        <div class="summary-box">
          ${a.imageUrl ? `<img class="plot-thumb" src="${a.imageUrl}" alt="Analysis plot" loading="lazy" onerror="this.style.display='none'"/>` : ""}
          <pre>${a.summary || "No summary available."}</pre>
          <button class="btn-dl" onclick="downloadHistoryPDF(${i})">⬇ Download PDF</button>
        </div>
      </td>`;
    tbody.appendChild(summaryRow);
  });
}

function toggleSummary(i) {
  const sRow  = document.getElementById(`summary-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  const isOpen = sRow.classList.contains("open");

  if (openRow !== null && openRow !== i) {
    document.getElementById(`summary-${openRow}`).classList.remove("open");
    const prevArrow = document.getElementById(`arrow-${openRow}`);
    if (prevArrow) prevArrow.textContent = "▸";
  }

  sRow.classList.toggle("open", !isOpen);
  arrow.textContent = isOpen ? "▸" : "▾";
  openRow = isOpen ? null : i;
}

function filterResults(type, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  openRow = null;

  let filtered = allAnalyses;
  if (type === "pass") filtered = allAnalyses.filter(a => a.passed === true);
  if (type === "fail") filtered = allAnalyses.filter(a => a.passed === false);

  document.getElementById("recordCount").textContent =
    `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;
  renderRows(filtered);
}

function clearLocalHistory() {
  if (!confirm("Clear all locally-stored analysis history? This cannot be undone.")) return;
  HistoryManager.clear();
  loadHistory();
}

function mergeAndSort(serverEntries, localEntries) {
  const all = [...serverEntries];
  localEntries.forEach(local => {
    const localTs = new Date(local.timestamp).getTime();
    const isDupe = serverEntries.some(s => {
      const sTs = new Date(s.timestamp).getTime();
      return Math.abs(localTs - sTs) < 5000 && s.testType === local.testType && s.filename === local.filename;
    });
    if (!isDupe) all.push(local);
  });
  return all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

async function loadHistory() {
  const localEntries = HistoryManager.getAll().map(normalizeLocal);

  try {
    const res = await fetch(`${BACKEND_URL}/history`, {
      headers: { "Authorization": `Bearer ${localStorage.getItem("mlcqa_token")}` },
      signal: AbortSignal.timeout(8000)
    });

    if (res.status === 401) { logout(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const serverEntries = (data.analyses || []).map(normalizeServer);

    if (serverEntries.length > 0 && localEntries.length === 0) {
      allAnalyses = serverEntries;
      setSourceBadge("server");
    } else if (serverEntries.length > 0 && localEntries.length > 0) {
      allAnalyses = mergeAndSort(serverEntries, localEntries);
      setSourceBadge("merged");
    } else if (localEntries.length > 0) {
      allAnalyses = localEntries;
      setSourceBadge("local");
    } else {
      allAnalyses = [];
    }

  } catch {
    allAnalyses = localEntries;
    if (localEntries.length > 0) setSourceBadge("local");
  }

  document.getElementById("recordCount").textContent =
    `${allAnalyses.length} record${allAnalyses.length !== 1 ? "s" : ""}`;
  renderRows(allAnalyses);
}

loadHistory();

// ── PDF Download ──────────────────────────────────────────────────────────────
async function downloadHistoryPDF(i) {
  const a = allAnalyses[i];
  if (!a) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const W = 210;
  const M = 14;

  doc.setFillColor(15, 30, 55);
  doc.rect(0, 0, W, 26, "F");
  doc.setFillColor(37, 99, 235);
  doc.rect(0, 0, 5, 26, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(255, 255, 255);
  doc.text("MLC QA — " + (a.testType || a.test_type || "Analysis") + " Report", M + 4, 12);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(180, 210, 230);
  const dt = new Date(a.timestamp || a.created_at).toLocaleString("en-GB", { dateStyle: "long", timeStyle: "short" });
  doc.text("Date: " + dt, M + 4, 19);
  doc.text("File: " + (a.filename || "—"), M + 4, 24);

  let y = 36;

  const badgeColor = a.passed ? [22, 163, 74] : [220, 38, 38];
  doc.setFillColor(...badgeColor);
  doc.roundedRect(M, y, W - M * 2, 13, 2, 2, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(255, 255, 255);
  doc.text(a.passed ? "✓  PASS" : "✗  FAIL", M + 5, y + 8);
  y += 18;

  const _imgUrl = a.imageUrl || a.image_url || null;
  if (_imgUrl) {
    try {
      const res  = await fetch(_imgUrl);
      const blob = await res.blob();
      const b64  = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
      const imgW = W - M * 2;
      const imgH = imgW * 0.5;
      doc.setDrawColor(180, 200, 220);
      doc.setLineWidth(0.3);
      doc.rect(M, y, imgW, imgH);
      doc.addImage(b64, "PNG", M, y, imgW, imgH);
      y += imgH + 5;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(7.5);
      doc.setTextColor(80, 105, 135);
      doc.text("Figure: Pylinac " + (a.testType || a.test_type || "") + " — Analyzed Image", M, y);
      y += 9;
    } catch { y += 4; }
  }

  const summaryLines = doc.splitTextToSize(a.summary || "", W - M * 2 - 10);
  const boxH = summaryLines.length * 5.4 + 16;
  doc.setFillColor(245, 248, 252);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "F");
  doc.setDrawColor(200, 215, 230);
  doc.setLineWidth(0.3);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "S");
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(15, 40, 80);
  doc.text("ANALYSIS SUMMARY", M + 5, y);
  y += 7;
  doc.setFont("courier", "normal");
  doc.setFontSize(8.2);
  doc.setTextColor(20, 45, 80);
  summaryLines.forEach(line => {
    if (y > 272) {
      doc.addPage();
      y = 18;
      doc.setFillColor(245, 248, 252);
      doc.roundedRect(M, y - 4, W - M * 2, 240, 2, 2, "F");
      doc.setFont("courier", "normal");
      doc.setFontSize(8.2);
      doc.setTextColor(20, 45, 80);
    }
    doc.text(line, M + 5, y);
    y += 5.4;
  });

  const pages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(235, 241, 248);
    doc.rect(0, 284, W, 13, "F");
    doc.setDrawColor(180, 200, 220);
    doc.setLineWidth(0.3);
    doc.line(0, 284, W, 284);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(60, 85, 120);
    doc.text("MLC QA Platform  ·  For clinical physics use only  ·  Not for diagnostic use", M, 291);
    doc.text("Page " + p + " of " + pages, W - 28, 291);
  }
  doc.save("MLCQA_" + (a.filename || "report") + ".pdf");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analysis History — MLC QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <!-- FIX: script.js was missing — BACKEND_URL, token, name, authHeaders(), logout() all come from here -->
  <script src="script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #040d1a; --surface: #071428; --surface2: #0a1f38;
      --border: #0e2a4a; --cyan: #00d4ff; --text: #e8f4f8; --muted: #7a9bb5;
      --success: #00e5a0; --danger: #ff4d6d;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none; z-index: 0;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 240px;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 10; padding: 28px 0;
    }
    .sidebar-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; padding: 0 28px 28px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .sidebar-logo span { color: var(--cyan); }
    .nav-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; padding: 0 28px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 28px; color: var(--muted); font-size: 0.9rem; text-decoration: none; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; cursor: pointer; }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--cyan); background: rgba(0,212,255,0.06); border-right: 2px solid var(--cyan); }
    .nav-icon { font-size: 1rem; width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 24px 28px 0; border-top: 1px solid var(--border); }
    .user-chip { display: flex; align-items: center; gap: 12px; padding: 12px 0; margin-bottom: 12px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 0.85rem; color: var(--cyan); flex-shrink: 0; }
    .user-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.75rem; color: var(--muted); }
    .logout-btn { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Main ── */
    .main { margin-left: 240px; padding: 40px 48px; position: relative; z-index: 1; }

    .page-header { margin-bottom: 36px; }
    .breadcrumb { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    .breadcrumb a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--cyan); }
    .page-header h1 { font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
    .page-header p { color: var(--muted); font-size: 0.9rem; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    .filter-left { display: flex; gap: 8px; }
    .filter-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 8px 18px; border-radius: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,212,255,0.05); }
    .record-count { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border); }
    thead th {
      padding: 14px 20px; text-align: left;
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      font-weight: 400;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s; cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 16px 20px; font-size: 0.88rem; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 100px;
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.03em;
    }
    .badge-pass { background: rgba(0,229,160,0.1); color: var(--success); border: 1px solid rgba(0,229,160,0.25); }
    .badge-fail { background: rgba(255,77,109,0.1); color: var(--danger); border: 1px solid rgba(255,77,109,0.25); }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .test-chip {
      background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.15);
      color: var(--cyan); padding: 3px 10px; border-radius: 4px;
      font-size: 0.75rem; font-family: 'DM Mono', monospace;
    }
    .filename { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.78rem; }
    .date-cell { color: var(--muted); font-size: 0.82rem; }

    /* ── Expanded summary row ── */
    .summary-row { display: none; }
    .summary-row.open { display: table-row; }
    .summary-row td {
      padding: 0 20px 20px;
      background: var(--bg);
    }
    .summary-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px;
    }
    .summary-box pre {
      white-space: pre-wrap; font-family: 'DM Mono', monospace;
      font-size: 0.82rem; color: var(--muted); line-height: 1.7;
    }
    .plot-thumb {
      width: 100%; border-radius: 8px; margin-bottom: 16px;
      border: 1px solid var(--border); display: block;
    }
    .btn-dl {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--cyan);
      color: var(--cyan); padding: 8px 18px; border-radius: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
      cursor: pointer; margin-top: 14px; transition: all 0.2s;
    }
    .btn-dl:hover { background: rgba(0,212,255,0.08); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 80px 24px;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { font-family: 'Syne', sans-serif; font-size: 1.1rem; margin-bottom: 8px; color: var(--muted); }
    .empty-state p { font-size: 0.88rem; color: var(--muted); margin-bottom: 24px; }
    .btn-cyan {
      background: var(--cyan); color: #040d1a; border: none;
      padding: 11px 28px; border-radius: 7px;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.2s;
    }
    .btn-cyan:hover { background: #33ddff; box-shadow: 0 4px 20px rgba(0,212,255,0.3); }

    /* ── Loading skeleton ── */
    .skeleton-row td { padding: 18px 20px; }
    .skel {
      height: 12px; border-radius: 4px;
      background: linear-gradient(90deg, var(--border) 25%, var(--surface2) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media(max-width:768px) { .sidebar{display:none;} .main{margin-left:0;padding:24px 20px;} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">MLC<span>QA</span></div>
  <div class="nav-label">Menu</div>
  <a class="nav-item" href="dashboard.html"><span class="nav-icon">▦</span> Dashboard</a>
  <a class="nav-item" href="mlc-qa.html"><span class="nav-icon">⚡</span> Picket Fence</a>
  <a class="nav-item" href="winston-lutz.html"><span class="nav-icon">◎</span> Winston-Lutz</a>
  <a class="nav-item" href="starshot.html"><span class="nav-icon">✦</span> Starshot</a>
  <a class="nav-item" href="congruence.html"><span class="nav-icon">⊞</span> Congruence</a>
  <a class="nav-item active" href="history.html"><span class="nav-icon">≡</span> History</a>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="user-name" id="sidebarName">Loading...</div>
        <div class="user-role">Medical Physicist</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Analysis History</div>
    <h1>Analysis History</h1>
    <p>Your last 30 days of QA analyses — auto-cleared after 30 days</p>
  </div>

  <div class="filter-bar">
    <div class="filter-left">
      <button class="filter-btn active" onclick="filterResults('all', this)">All</button>
      <button class="filter-btn" onclick="filterResults('pass', this)">Pass</button>
      <button class="filter-btn" onclick="filterResults('fail', this)">Fail</button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="record-count" id="recordCount"></span>
      <span id="dataSourceBadge" style="display:none;font-family:'DM Mono',monospace;font-size:0.72rem;padding:3px 9px;border-radius:4px;"></span>
      <button id="clearHistoryBtn" onclick="clearLocalHistory()" style="display:none;background:transparent;border:1px solid rgba(255,77,109,0.4);color:rgba(255,77,109,0.7);padding:6px 14px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:0.78rem;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--danger)';this.style.color='var(--danger)'" onmouseout="this.style.borderColor='rgba(255,77,109,0.4)';this.style.color='rgba(255,77,109,0.7)'">Clear local history</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="historyTable">
      <thead>
        <tr>
          <th>Result</th>
          <th>Test Type</th>
          <th>File</th>
          <th>Date & Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr class="skeleton-row">
          <td><div class="skel" style="width:60px"></div></td>
          <td><div class="skel" style="width:100px"></div></td>
          <td><div class="skel" style="width:160px"></div></td>
          <td><div class="skel" style="width:120px"></div></td>
          <td><div class="skel" style="width:40px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:60px"></div></td>
          <td><div class="skel" style="width:100px"></div></td>
          <td><div class="skel" style="width:140px"></div></td>
          <td><div class="skel" style="width:120px"></div></td>
          <td><div class="skel" style="width:40px"></div></td>
        </tr>
        <tr class="skeleton-row">
          <td><div class="skel" style="width:60px"></div></td>
          <td><div class="skel" style="width:100px"></div></td>
          <td><div class="skel" style="width:180px"></div></td>
          <td><div class="skel" style="width:120px"></div></td>

        </tr>
      </tbody>
    </table>
  </div>
</main>

<script>
// BACKEND_URL, logout() provided by script.js (loaded in <head>)
// HistoryManager also provided by script.js

const _histName = localStorage.getItem("mlcqa_name");
const _displayName = (_histName && _histName !== "undefined" && _histName !== "null" && _histName.trim() !== "")
  ? _histName : "User";
document.getElementById("sidebarName").textContent = _displayName;
document.getElementById("avatarInitial").textContent = _displayName.charAt(0).toUpperCase();

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
    + " · " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

let allAnalyses = [];
let openRow = null;

// Normalize entries from either source into a single shape:
// { passed, testType, filename, summary, imageUrl, timestamp, source }
function normalizeServer(a) {
  return {
    passed:    a.passed,
    testType:  a.test_type  || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || a.analysis_summary || "",
    imageUrl:  a.image_url  || null,
    timestamp: a.created_at || new Date().toISOString(),
    source:    "server"
  };
}
function normalizeLocal(a) {
  return {
    passed:    a.passed,
    testType:  a.testType   || "Unknown",
    filename:  a.filename   || "—",
    summary:   a.summary    || "",
    imageUrl:  a.imageUrl   || null,
    timestamp: a.timestamp  || new Date().toISOString(),
    source:    "local"
  };
}

function setSourceBadge(source) {
  const badge = document.getElementById("dataSourceBadge");
  const clearBtn = document.getElementById("clearHistoryBtn");
  if (source === "server") {
    badge.textContent = "● server";
    badge.style.cssText = "display:inline-block;background:rgba(0,229,160,0.08);color:var(--success);border:1px solid rgba(0,229,160,0.2);font-family:'DM Mono',monospace;font-size:0.72rem;padding:3px 9px;border-radius:4px;";
    clearBtn.style.display = "none";
  } else if (source === "local") {
    badge.textContent = "● local";
    badge.style.cssText = "display:inline-block;background:rgba(0,212,255,0.07);color:var(--cyan);border:1px solid rgba(0,212,255,0.18);font-family:'DM Mono',monospace;font-size:0.72rem;padding:3px 9px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  } else if (source === "merged") {
    badge.textContent = "● server + local";
    badge.style.cssText = "display:inline-block;background:rgba(0,212,255,0.07);color:var(--cyan);border:1px solid rgba(0,212,255,0.18);font-family:'DM Mono',monospace;font-size:0.72rem;padding:3px 9px;border-radius:4px;";
    clearBtn.style.display = "inline-block";
  }
}

function renderRows(data) {
  const tbody = document.getElementById("historyBody");

  if (data.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <h3>No analyses found</h3>
          <p>Complete a QA analysis to see it logged here automatically</p>
          <a class="btn-cyan" href="mlc-qa.html">Run Picket Fence</a>
        </div>
      </td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  data.forEach((a, i) => {
    const mainRow = document.createElement("tr");
    mainRow.id = `row-${i}`;
    const sourceDot = a.source === "local"
      ? `<span title="Saved locally" style="color:var(--cyan);font-size:0.65rem;margin-left:5px;opacity:0.6;">●</span>`
      : "";
    mainRow.innerHTML = `
      <td><span class="badge ${a.passed ? 'badge-pass' : 'badge-fail'}">${a.passed ? 'Pass' : 'Fail'}</span></td>
      <td><span class="test-chip">${a.testType}</span></td>
      <td class="filename">${a.filename}${sourceDot}</td>
      <td class="date-cell">${formatDate(a.timestamp)}</td>
      <td style="color:var(--muted);font-size:1rem;" id="arrow-${i}">▸</td>`;
    mainRow.addEventListener("click", () => toggleSummary(i));
    tbody.appendChild(mainRow);

    const summaryRow = document.createElement("tr");
    summaryRow.className = "summary-row";
    summaryRow.id = `summary-${i}`;
    summaryRow.innerHTML = `
      <td colspan="5">
        <div class="summary-box">
          ${a.imageUrl ? `<img class="plot-thumb" src="${a.imageUrl}" alt="Analysis plot" loading="lazy" onerror="this.style.display='none'"/>` : ""}
          <pre>${a.summary || "No summary available."}</pre>
          <button class="btn-dl" onclick="downloadHistoryPDF(${i})">⬇ Download PDF</button>
        </div>
      </td>`;
    tbody.appendChild(summaryRow);
  });
}

function toggleSummary(i) {
  const sRow   = document.getElementById(`summary-${i}`);
  const arrow  = document.getElementById(`arrow-${i}`);
  const isOpen = sRow.classList.contains("open");

  if (openRow !== null && openRow !== i) {
    document.getElementById(`summary-${openRow}`).classList.remove("open");
    const prevArrow = document.getElementById(`arrow-${openRow}`);
    if (prevArrow) prevArrow.textContent = "▸";
  }

  sRow.classList.toggle("open", !isOpen);
  arrow.textContent = isOpen ? "▸" : "▾";
  openRow = isOpen ? null : i;
}

function filterResults(type, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  openRow = null;

  let filtered = allAnalyses;
  if (type === "pass") filtered = allAnalyses.filter(a => a.passed === true);
  if (type === "fail") filtered = allAnalyses.filter(a => a.passed === false);

  document.getElementById("recordCount").textContent =
    `${filtered.length} record${filtered.length !== 1 ? "s" : ""}`;
  renderRows(filtered);
}

function clearLocalHistory() {
  if (!confirm("Clear all locally-stored analysis history? This cannot be undone.")) return;
  HistoryManager.clear();
  loadHistory();
}

// ── Merge helper: deduplicate by timestamp (within 5s) ────────────────────────
function mergeAndSort(serverEntries, localEntries) {
  const all = [...serverEntries];
  localEntries.forEach(local => {
    const localTs = new Date(local.timestamp).getTime();
    const isDupe = serverEntries.some(s => {
      const sTs = new Date(s.timestamp).getTime();
      return Math.abs(localTs - sTs) < 5000 && s.testType === local.testType && s.filename === local.filename;
    });
    if (!isDupe) all.push(local);
  });
  return all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

// ── Load history: try server, merge with / fall back to localStorage ───────────
async function loadHistory() {
  const localEntries = HistoryManager.getAll().map(normalizeLocal);

  try {
    const res = await fetch(`${BACKEND_URL}/history`, {
      headers: { "Authorization": `Bearer ${localStorage.getItem("mlcqa_token")}` },
      signal: AbortSignal.timeout(8000)
    });

    if (res.status === 401) { logout(); return; }

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const serverEntries = (data.analyses || []).map(normalizeServer);

    if (serverEntries.length > 0 && localEntries.length === 0) {
      allAnalyses = serverEntries;
      setSourceBadge("server");
    } else if (serverEntries.length > 0 && localEntries.length > 0) {
      allAnalyses = mergeAndSort(serverEntries, localEntries);
      setSourceBadge("merged");
    } else if (localEntries.length > 0) {
      allAnalyses = localEntries;
      setSourceBadge("local");
    } else {
      allAnalyses = [];
    }

  } catch {
    // Server unavailable — use localStorage only
    allAnalyses = localEntries;
    if (localEntries.length > 0) {
      setSourceBadge("local");
    }
  }

  document.getElementById("recordCount").textContent =
    `${allAnalyses.length} record${allAnalyses.length !== 1 ? "s" : ""}`;
  renderRows(allAnalyses);
}

loadHistory();

// ── PDF Download from history ────────────────────────────────────────────────
async function downloadHistoryPDF(i) {
  const a = allAnalyses[i];
  if (!a) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const W = 210;
  const M = 14;

  // Header bar — dark background with accent stripe
  doc.setFillColor(15, 30, 55);
  doc.rect(0, 0, W, 26, "F");
  doc.setFillColor(0, 175, 215);
  doc.rect(0, 0, 5, 26, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(255, 255, 255);
  doc.text("MLC QA — " + (a.testType || a.test_type || "Analysis") + " Report", M + 4, 12);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(180, 210, 230);
  const dt = new Date(a.timestamp || a.created_at).toLocaleString("en-GB", { dateStyle: "long", timeStyle: "short" });
  doc.text("Date: " + dt, M + 4, 19);
  doc.text("File: " + (a.filename || "—"), M + 4, 24);

  let y = 36;

  // Pass/Fail badge
  const badgeColor = a.passed ? [0, 168, 107] : [195, 45, 70];
  doc.setFillColor(...badgeColor);
  doc.roundedRect(M, y, W - M * 2, 13, 2, 2, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(255, 255, 255);
  doc.text(a.passed ? "✓  PASS" : "✗  FAIL", M + 5, y + 8);
  y += 18;

  // Analysis image
  const _imgUrl = a.imageUrl || a.image_url || null;
  if (_imgUrl) {
    try {
      const res  = await fetch(_imgUrl);
      const blob = await res.blob();
      const b64  = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onloadend = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
      const imgW = W - M * 2;
      const imgH = imgW * 0.5;
      doc.setDrawColor(180, 200, 220);
      doc.setLineWidth(0.3);
      doc.rect(M, y, imgW, imgH);
      doc.addImage(b64, "PNG", M, y, imgW, imgH);
      y += imgH + 5;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(7.5);
      doc.setTextColor(80, 105, 135);
      doc.text("Figure: Pylinac " + (a.testType || a.test_type || "") + " — Analyzed Image", M, y);
      y += 9;
    } catch { y += 4; }
  }

  // Summary box — light background with dark text
  const summaryLines = doc.splitTextToSize(a.summary || "", W - M * 2 - 10);
  const boxH = summaryLines.length * 5.4 + 16;
  doc.setFillColor(245, 248, 252);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "F");
  doc.setDrawColor(200, 215, 230);
  doc.setLineWidth(0.3);
  doc.roundedRect(M, y, W - M * 2, boxH, 2, 2, "S");
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(15, 40, 80);
  doc.text("ANALYSIS SUMMARY", M + 5, y);
  y += 7;
  doc.setFont("courier", "normal");
  doc.setFontSize(8.2);
  doc.setTextColor(20, 45, 80);
  summaryLines.forEach(line => {
    if (y > 272) {
      doc.addPage();
      y = 18;
      doc.setFillColor(245, 248, 252);
      doc.roundedRect(M, y - 4, W - M * 2, 240, 2, 2, "F");
      doc.setFont("courier", "normal");
      doc.setFontSize(8.2);
      doc.setTextColor(20, 45, 80);
    }
    doc.text(line, M + 5, y);
    y += 5.4;
  });

  // Footer on every page
  const pages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFillColor(235, 241, 248);
    doc.rect(0, 284, W, 13, "F");
    doc.setDrawColor(180, 200, 220);
    doc.setLineWidth(0.3);
    doc.line(0, 284, W, 284);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(60, 85, 120);
    doc.text("MLC QA Platform  ·  For clinical physics use only  ·  Not for diagnostic use", M, 291);
    doc.text("Page " + p + " of " + pages, W - 28, 291);
  }
  doc.save("MLCQA_" + (a.filename || "report") + ".pdf");
}
</script>

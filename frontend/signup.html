<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — MLC QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:      #005A9C;
      --brand-deep: #0B4A75;
      --midnight:   #0F2537;
      --coral:      #D97D64;
      --bg:         #F4F7F9;
      --surface:    #ffffff;
      --border:     #D0DCE8;
      --text:       #0F2537;
      --text-2:     #3A5068;
      --text-muted: #7A95AB;
      --pass:       #1A9E6A;
      --fail:       #C85A43;
      --font:       'IBM Plex Sans', system-ui, sans-serif;
      --mono:       'IBM Plex Mono', 'Courier New', monospace;
      --r:          6px;
      --t:          0.15s ease;
    }

    body {
      background: var(--midnight);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* NAV */
    nav {
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      background: rgba(15,37,55,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo { font-family: var(--mono); font-weight: 600; font-size: 1rem; color: #fff; text-decoration: none; letter-spacing: 0.04em; }
    .logo b { color: var(--coral); font-weight: 600; }

    /* MAIN */
    .auth-wrapper {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px;
    }

    .auth-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%; max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.28);
      animation: up 0.35s ease both;
      position: relative;
      overflow: hidden;
    }
    /* Brand accent top stripe */
    .auth-panel::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(to right, var(--brand), var(--coral));
    }
    @keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    /* Back link bar — inside the panel */
    .back-link-bar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      margin-top: 3px; /* clears the ::before stripe */
    }
    .back-link-bar a {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 0.7rem;
      color: var(--text-muted); text-decoration: none;
      letter-spacing: 0.04em;
      transition: color var(--t);
    }
    .back-link-bar a:hover { color: var(--brand); }

    /* Panel inner content */
    .auth-panel-body {
      padding: 32px 44px 40px;
    }

    .panel-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .panel-logo-mark {
      width: 30px; height: 30px;
      background: var(--brand-deep);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .panel-logo-mark svg { width: 16px; height: 16px; fill: #fff; }
    .panel-logo-text { font-family: var(--mono); font-weight: 600; font-size: 1rem; color: var(--midnight); letter-spacing: 0.04em; }
    .panel-logo-text span { color: var(--coral); }

    h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 6px; color: var(--midnight); }
    .subtitle { font-size: 0.83rem; font-weight: 300; color: var(--text-muted); margin-bottom: 28px; }

    /* Messages */
    .msg { font-size: 0.82rem; padding: 10px 14px; border-radius: var(--r); margin-bottom: 16px; line-height: 1.5; }
    .msg:empty { display: none; }
    .msg.error   { background: rgba(200,90,67,0.08); border: 1px solid rgba(200,90,67,0.3); color: var(--fail); display: block; }
    .msg.success { background: rgba(26,158,106,0.08); border: 1px solid rgba(26,158,106,0.3); color: var(--pass);  display: block; }
    .msg.warn    { background: rgba(217,125,100,0.08); border: 1px solid rgba(217,125,100,0.3); color: #a05a35; display: block; }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.76rem; font-weight: 500; color: var(--text-2); margin-bottom: 6px; letter-spacing: 0.02em; }
    .field input {
      width: 100%; padding: 10px 13px;
      background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--r);
      font-family: var(--font); font-size: 0.88rem; color: var(--text);
      outline: none; transition: border-color var(--t), box-shadow var(--t);
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus {
      border-color: var(--brand);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(0,90,156,0.1);
    }

    .password-wrapper { position: relative; }
    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; user-select: none; opacity: 0.5; transition: opacity var(--t);
      display: flex; align-items: center; color: var(--text-muted);
    }
    .toggle-password:hover { opacity: 1; }

    .strength-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 8px; }
    .strength-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .hint { font-family: var(--mono); font-size: 0.68rem; margin-top: 5px; min-height: 1em; }

    /* Button */
    .btn-auth {
      width: 100%;
      background: var(--brand);
      color: #fff; border: none;
      padding: 11px 20px; border-radius: var(--r);
      font-family: var(--font); font-weight: 500; font-size: 0.9rem;
      cursor: pointer; margin-top: 8px;
      transition: background var(--t), transform 0.1s;
    }
    .btn-auth:hover:not(:disabled) { background: var(--brand-deep); transform: translateY(-1px); }
    .btn-auth:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Divider */
    .auth-divider {
      text-align: center; font-family: var(--mono);
      font-size: 0.68rem; color: var(--text-muted); margin: 20px 0; position: relative;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--border);
    }
    .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }

    .auth-link { text-align: center; font-size: 0.82rem; color: var(--text-muted); }
    .auth-link a { color: var(--brand); text-decoration: none; font-weight: 500; }
    .auth-link a:hover { text-decoration: underline; }

    /* Footer */
    footer {
      background: rgba(11,74,117,0.6);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 18px 40px;
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 0.68rem;
      color: rgba(255,255,255,0.32);
    }

    @media (max-width: 480px) {
      nav { padding: 0 20px; }
      .auth-panel-body { padding: 24px 22px 32px; }
      footer { flex-direction: column; gap: 5px; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">MLC<b>QA</b></a>
</nav>

<div class="auth-wrapper">
  <div class="auth-panel">

    <!-- Back to home bar — inside the panel -->
    <div class="back-link-bar">
      <a href="index.html">← Back to home</a>
    </div>

    <div class="auth-panel-body">
      <div class="panel-logo">
        <div class="panel-logo-mark">
          <svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg>
        </div>
        <div class="panel-logo-text">MLC<span>QA</span></div>
      </div>
      <h1>Create account</h1>
      <p class="subtitle">Start running analyses in minutes — free</p>
      <div id="msg" class="msg"></div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Dr. Jane Smith" autocomplete="name"/>
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@hospital.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <span class="toggle-password" onclick="togglePassword('password', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="hint" id="strengthLabel"></div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password"/>
          <span class="toggle-password" onclick="togglePassword('confirm', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </span>
        </div>
      </div>
      <button class="btn-auth" id="signupBtn" onclick="doSignup()">Create Account</button>
      <div class="auth-divider">or</div>
      <div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div>
    </div>

  </div>
</div>

<footer>
  <span>© 2026 MLC QA · Built with Pylinac</span>
  <span>For clinical physics use only</span>
</footer>

<script>
if (localStorage.getItem("mlcqa_token")) window.location.href = "dashboard.html";

function checkStrength(val) {
  const fill  = document.getElementById("strengthFill");
  const label = document.getElementById("strengthLabel");
  if (!val) { fill.style.width = "0%"; label.textContent = ""; return; }
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w: "20%", c: "#C85A43", t: "Too weak" },
    { w: "40%", c: "#D97D64", t: "Weak"     },
    { w: "60%", c: "#d4a843", t: "Fair"     },
    { w: "80%", c: "#005A9C", t: "Good"     },
    { w: "100%",c: "#1A9E6A", t: "Strong"   },
  ];
  const l = levels[Math.min(score - 1, 4)] || levels[0];
  fill.style.width = l.w; fill.style.background = l.c;
  label.textContent = l.t; label.style.color = l.c;
}

async function doSignup() {
  const name     = document.getElementById("name").value.trim();
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm  = document.getElementById("confirm").value;
  const btn      = document.getElementById("signupBtn");
  const msg      = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "";
  if (!name || !email || !password || !confirm) { msg.className = "msg error"; msg.textContent = "Please fill in all fields."; return; }
  if (password.length < 6) { msg.className = "msg error"; msg.textContent = "Password must be at least 6 characters."; return; }
  if (password !== confirm) { msg.className = "msg error"; msg.textContent = "Passwords do not match."; return; }
  btn.disabled = true; btn.textContent = "Creating account…";
  try {
    const res = await fetch(`${BACKEND_URL}/auth/signup`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (!res.ok) { msg.className = "msg error"; msg.textContent = data.detail || "Signup failed. Please try again."; btn.disabled = false; btn.textContent = "Create Account"; return; }
    msg.className = "msg success"; msg.textContent = "Account created! Redirecting to login…";
    localStorage.setItem("mlcqa_pending_name", name);
    setTimeout(() => window.location.href = "login.html?new=1", 1500);
  } catch {
    msg.className = "msg error"; msg.textContent = "Could not reach the server. Please try again.";
    btn.disabled = false; btn.textContent = "Create Account";
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — MLC QA</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js"></script>
</head>
<body>
<div class="auth-page">
<div class="auth-card fade-up">
  <a href="index.html" class="back-link">← Back to home</a>
  <div class="logo-row">
    <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
    <div class="logo-text">MLC<span>QA</span></div>
  </div>
  <h1>Create account</h1>
  <p class="subtitle">Start running analyses in minutes — free</p>

  <div id="msg" class="msg"></div>

  <div class="field">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Dr. Jane Smith" autocomplete="name"/>
  </div>
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@hospital.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
      <span class="toggle-password" onclick="togglePassword('password', this)">🙈</span>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="hint" id="strengthLabel"></div>
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <div class="password-wrapper">
      <input type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password"/>
      <span class="toggle-password" onclick="togglePassword('confirm', this)">🙈</span>
    </div>
  </div>

  <button class="btn-auth" id="signupBtn" onclick="doSignup()">Create Account</button>

  <div class="auth-divider">— or —</div>
  <div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div>
</div>
</div>

<script>
// BACKEND_URL and auth redirect are now in script.js
if (localStorage.getItem("mlcqa_token")) {
  window.location.href = "dashboard.html";
}

function checkStrength(val) {
  const fill  = document.getElementById("strengthFill");
  const label = document.getElementById("strengthLabel");
  if (!val) { fill.style.width = "0%"; label.textContent = ""; return; }
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w: "20%", c: "#ff4d6d", t: "Too weak" },
    { w: "40%", c: "#ff9f43", t: "Weak" },
    { w: "60%", c: "#ffd32a", t: "Fair" },
    { w: "80%", c: "#00d4ff", t: "Good" },
    { w: "100%", c: "#00e5a0", t: "Strong" },
  ];
  const l = levels[Math.min(score - 1, 4)] || levels[0];
  fill.style.width = l.w; fill.style.background = l.c;
  label.textContent = l.t; label.style.color = l.c;
}

async function doSignup() {
  const name     = document.getElementById("name").value.trim();
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm  = document.getElementById("confirm").value;
  const btn      = document.getElementById("signupBtn");
  const msg      = document.getElementById("msg");

  msg.className = "msg"; msg.textContent = "";

  if (!name || !email || !password || !confirm) {
    msg.className = "msg error"; msg.textContent = "Please fill in all fields."; return;
  }
  if (password.length < 6) {
    msg.className = "msg error"; msg.textContent = "Password must be at least 6 characters."; return;
  }
  if (password !== confirm) {
    msg.className = "msg error"; msg.textContent = "Passwords do not match."; return;
  }

  btn.disabled = true; btn.textContent = "Creating account...";

  try {
    const res = await fetch(`${BACKEND_URL}/auth/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      msg.className = "msg error";
      msg.textContent = data.detail || "Signup failed. Please try again.";
      btn.disabled = false; btn.textContent = "Create Account";
      return;
    }

    msg.className = "msg success";
    msg.textContent = "✅ Account created! Redirecting to login...";
    setTimeout(() => window.location.href = "login.html?new=1", 1500);

  } catch {
    msg.className = "msg error";
    msg.textContent = "Could not reach the server. Please try again.";
    btn.disabled = false; btn.textContent = "Create Account";
  }
}
</script>
</body>
</html>

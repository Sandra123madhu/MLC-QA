<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — MLC QA</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-page">
<div class="auth-card fade-up">
  <a href="index.html" class="back-link">← Back to home</a>
  <div class="logo-row">
    <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
    <div class="logo-text">MLC<span>QA</span></div>
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your account to continue</p>
  <div class="server-status" id="serverStatus">
    <div class="status-dot-sm dot-warn"></div><span>Checking server...</span>
  </div>
  <div id="msg" class="msg"></div>
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@hospital.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    <div style="text-align:right;margin-top:5px"><a href="#" style="font-size:0.75rem;color:var(--text-muted);font-family:var(--mono)">Forgot password?</a></div>
  </div>
  <button class="btn-auth" id="loginBtn" onclick="doLogin()">Sign In</button>
  <div class="auth-divider">— or —</div>
  <div class="auth-link">Don't have an account? <a href="signup.html">Sign up free</a></div>
</div>
</div>
<script>
const BACKEND_URL = "https://mlc-qa.onrender.com";
if (localStorage.getItem("mlcqa_token")) { window.location.href = "dashboard.html"; }
(async () => {
  const el = document.getElementById("serverStatus");
  try {
    const r = await fetch(`${BACKEND_URL}/`);
    el.innerHTML = r.ok
      ? `<div class="status-dot-sm dot-ok"></div><span>Server online</span>`
      : `<div class="status-dot-sm dot-warn"></div><span>Server degraded</span>`;
  } catch { el.innerHTML = `<div class="status-dot-sm dot-warn"></div><span>Server waking up — please wait ~60s</span>`; }
})();
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "";
  if (!email || !password) { msg.className = "msg error"; msg.textContent = "Please enter your email and password."; return; }
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const res = await fetch(`${BACKEND_URL}/auth/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,password}) });
    const data = await res.json();
    if (!res.ok) { msg.className="msg error"; msg.textContent=data.detail||"Invalid email or password."; btn.disabled=false; btn.textContent="Sign In"; return; }
    localStorage.setItem("mlcqa_token", data.access_token);
    localStorage.setItem("mlcqa_name", data.name);
    window.location.href = "dashboard.html";
  } catch { msg.className="msg error"; msg.textContent="Server unreachable. Wait 30–60 seconds and try again."; btn.disabled=false; btn.textContent="Sign In"; }
}
</script>
</body>
</html>

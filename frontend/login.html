<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — MLC QA</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js"></script>
</head>
<body>
<div class="auth-page">
<div class="auth-card fade-up">
  <a href="index.html" class="back-link">← Back to home</a>
  <div class="logo-row">
    <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
    <div class="logo-text">MLC<span>QA</span></div>
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your account to continue</p>
  <div class="server-status" id="serverStatus">
    <div class="status-dot-sm dot-warn"></div><span>Checking server...</span>
  </div>
  <div id="msg" class="msg"></div>
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@hospital.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      <span class="toggle-password" onclick="togglePassword('password', this)">🙈</span>
    </div>
    <div style="text-align:right;margin-top:5px"><a href="#" onclick="showForgotPrompt()" style="font-size:0.75rem;color:var(--text-muted);font-family:var(--mono)">Forgot password?</a></div>
  </div>
  <button class="btn-auth" id="loginBtn" onclick="doLogin()">Sign In</button>
  <div class="auth-divider">— or —</div>
  <div class="auth-link">Don't have an account? <a href="signup.html">Sign up free</a></div>
</div>
</div>
<script>
if (localStorage.getItem("mlcqa_token")) { window.location.href = "dashboard.html"; }
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

// Clear any stale warning banners when the user interacts with the form
function clearMsg() {
  const msg = document.getElementById("msg");
  if (msg && msg.className.includes("warn")) {
    msg.className = "msg"; msg.textContent = "";
  }
}
document.getElementById("email").addEventListener("focus", clearMsg);
document.getElementById("password").addEventListener("focus", clearMsg);

// Show a banner if redirected here because the session expired
if (new URLSearchParams(window.location.search).get("reason") === "session_expired") {
    const msg = document.getElementById("msg");
    msg.className = "msg warn";
    msg.textContent = "⚠️ Your session has expired. Please sign in again.";
}

async function doLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "";
  if (!email || !password) { msg.className = "msg error"; msg.textContent = "Please enter your email and password."; return; }
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const res = await fetch(`${BACKEND_URL}/auth/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,password}) });
    const data = await res.json();
    if (!res.ok) { msg.className="msg error"; msg.textContent=data.detail||"Invalid email or password."; btn.disabled=false; btn.textContent="Sign In"; return; }
    localStorage.setItem("mlcqa_token", data.token || data.access_token);
    localStorage.setItem("mlcqa_name", data.name);
    window.location.href = "dashboard.html";
  } catch (err) {
    btn.disabled = false; btn.textContent = "Sign In";
    // First, check if server is actually reachable before blaming cold start
    try {
      const ping = await fetch(`${BACKEND_URL}/`, { signal: AbortSignal.timeout(4000) });
      if (ping.ok) {
        // Server IS online — this was just a network blip, not a cold start
        msg.className = "msg error";
        msg.textContent = "Connection error. Please try again.";
        return;
      }
    } catch (_) {}
    // Server is genuinely unreachable — show waking up message and auto-retry
    msg.className = "msg warn";
    msg.textContent = "⏳ Server is starting up. Will notify you when ready...";
    let retryCount = 0;
    const retryInterval = setInterval(async () => {
      retryCount++;
      try {
        const ping = await fetch(`${BACKEND_URL}/`, { signal: AbortSignal.timeout(4000) });
        if (ping.ok) {
          clearInterval(retryInterval);
          msg.className = "msg success";
          msg.textContent = "✅ Server is online! You can sign in now.";
          const statusEl = document.getElementById("serverStatus");
          if (statusEl) statusEl.innerHTML = `<div class="status-dot-sm dot-ok"></div><span>Server online</span>`;
        }
      } catch (_) {}
      if (retryCount >= 30) {
        clearInterval(retryInterval);
        msg.className = "msg error";
        msg.textContent = "Server took too long to respond. Please refresh and try again.";
      }
    }, 2000);
  }
}

function showForgotPrompt() {
  // Password reset via email is not yet implemented on the backend.
  // Show a clear, non-scary info message and auto-dismiss after 10s.
  const msg = document.getElementById("msg");
  msg.className = "msg warn";
  msg.textContent = "⚠️ Automated password reset is not yet available. Please contact your administrator to reset your password.";
  setTimeout(() => { msg.className = "msg"; msg.textContent = ""; }, 10000);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — MLC QA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="script.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0f1117; --ink2: #4a5068; --ink3: #9098b0;
      --border: #e8eaf0; --bg: #ffffff; --bg2: #f6f7fb;
      --blue: #2563eb; --blue2: #1d4ed8;
      --pass: #16a34a; --fail: #dc2626; --warn: #d97706;
    }
    body {
      background: var(--bg2); color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      height: 60px; display: flex; align-items: center; padding: 0 40px;
      background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 1.05rem; color: var(--ink); text-decoration: none; }
    .logo b { color: var(--blue); }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .auth-panel {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 40px 44px; width: 100%; max-width: 420px;
      animation: up 0.35s ease both;
    }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .panel-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .panel-logo-mark { width: 30px; height: 30px; background: var(--blue); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .panel-logo-mark svg { width: 16px; height: 16px; fill: #fff; }
    .panel-logo-text { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 1rem; color: var(--ink); }
    .panel-logo-text span { color: var(--blue); }
    h1 { font-size: 1.45rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; font-weight: 300; color: var(--ink2); margin-bottom: 28px; }
    .msg { display: none; font-size: 0.82rem; padding: 10px 14px; border-radius: 7px; margin-bottom: 16px; line-height: 1.5; }
    .msg.error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
    .msg.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; display: block; }
    .msg.warn    { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; display: block; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 10px 13px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 7px;
      font-family: 'IBM Plex Sans', sans-serif; font-size: 0.88rem; color: var(--ink);
      outline: none; transition: border-color 0.12s, background 0.12s;
    }
    .field input:focus { border-color: var(--blue); background: var(--bg); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 0.9rem; user-select: none; opacity: 0.6; }
    .toggle-password:hover { opacity: 1; }
    .strength-bar { height: 4px; border-radius: 99px; background: var(--border); margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.3s, background 0.3s; }
    .strength-hint { font-size: 0.72rem; color: var(--ink3); margin-top: 4px; }
    .btn-auth {
      width: 100%; background: var(--blue); color: #fff; border: none;
      padding: 11px 20px; border-radius: 7px;
      font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 0.9rem;
      cursor: pointer; margin-top: 8px; transition: background 0.12s, transform 0.1s;
    }
    .btn-auth:hover:not(:disabled) { background: var(--blue2); transform: translateY(-1px); }
    .btn-auth:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .back-to-login { text-align: center; font-size: 0.82rem; color: var(--ink2); margin-top: 18px; }
    .back-to-login a { color: var(--blue); text-decoration: none; font-weight: 500; }
    footer {
      border-top: 1px solid var(--border); padding: 18px 40px;
      display: flex; justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--ink3);
      background: var(--bg);
    }
  </style>
</head>
<body>
<nav><a class="logo" href="index.html">MLC<b>QA</b></a></nav>

<div class="auth-wrapper">
  <div class="auth-panel">
    <div class="panel-logo">
      <div class="panel-logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.18L13 6.1v3.8L8 12.82 3 9.9V6.1L8 3.18z"/></svg></div>
      <div class="panel-logo-text">MLC<span>QA</span></div>
    </div>
    <h1>Choose a new password</h1>
    <p class="subtitle">Must be at least 8 characters</p>
    <div id="msg" class="msg"></div>
    <div id="formArea">
      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <span class="toggle-password" onclick="togglePassword('newPassword', this)">🙈</span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-hint" id="strengthHint"></div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password"/>
          <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">🙈</span>
        </div>
      </div>
      <button class="btn-auth" id="resetBtn" onclick="doReset()">Set New Password</button>
    </div>
    <div class="back-to-login"><a href="login.html">← Back to Sign In</a></div>
  </div>
</div>

<footer>
  <span>© 2026 MLC QA · Built with Pylinac</span>
  <span>For clinical physics use only</span>
</footer>

<script>
const token = new URLSearchParams(window.location.search).get("token");

window.addEventListener("DOMContentLoaded", () => {
  if (!token) {
    document.getElementById("msg").className = "msg error";
    document.getElementById("msg").textContent = "Invalid or missing reset link. Please request a new one.";
    document.getElementById("formArea").style.display = "none";
  }
  document.getElementById("confirmPassword").addEventListener("keydown", e => {
    if (e.key === "Enter") doReset();
  });
});

function checkStrength(val) {
  const fill = document.getElementById("strengthFill");
  const hint = document.getElementById("strengthHint");
  if (!val) { fill.style.width = "0%"; hint.textContent = ""; return; }
  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/\d/.test(val))   score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w: "20%", bg: "#dc2626", label: "Too short" },
    { w: "40%", bg: "#dc2626", label: "Weak" },
    { w: "60%", bg: "#d97706", label: "Fair" },
    { w: "80%", bg: "#2563eb", label: "Good" },
    { w: "100%",bg: "#16a34a", label: "Strong" },
  ];
  const l = levels[Math.min(score, 4)];
  fill.style.width = l.w; fill.style.background = l.bg;
  hint.textContent = l.label; hint.style.color = l.bg;
}

async function doReset() {
  const newPw  = document.getElementById("newPassword").value;
  const confPw = document.getElementById("confirmPassword").value;
  const btn    = document.getElementById("resetBtn");
  const msgEl  = document.getElementById("msg");
  msgEl.className = "msg"; msgEl.textContent = "";

  if (newPw.length < 8) {
    msgEl.className = "msg error"; msgEl.textContent = "Password must be at least 8 characters."; return;
  }
  if (newPw !== confPw) {
    msgEl.className = "msg error"; msgEl.textContent = "Passwords do not match."; return;
  }

  btn.disabled = true; btn.textContent = "Updating…";

  try {
    const res  = await fetch(`${BACKEND_URL}/auth/reset-password`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, new_password: newPw }),
      signal: AbortSignal.timeout(10000)
    });
    const data = await res.json();
    if (!res.ok) {
      msgEl.className = "msg error";
      msgEl.textContent = data.detail || "Could not reset password. The link may have expired.";
      btn.disabled = false; btn.textContent = "Set New Password"; return;
    }
    msgEl.className = "msg success";
    msgEl.textContent = "✅ Password updated! Redirecting to sign in…";
    document.getElementById("formArea").style.opacity = "0.4";
    setTimeout(() => { window.location.href = "login.html"; }, 2500);
  } catch (err) {
    msgEl.className = "msg error";
    msgEl.textContent = "Connection error. Please try again.";
    btn.disabled = false; btn.textContent = "Set New Password";
  }
}
</script>
</body>
</html>
